[project]
name = "mini-claude-code"
version = "0.1.0"
description = "Learning project: mini Claude Code agent with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    # Declared early so later milestones can import without reshuffling deps.
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "neo4j>=5.0",
    "pyyaml>=6.0",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.29.1",
]

[project.scripts]
mcc-smoke = "mini_claude_code.smoke:main"
mcc-tools-parity = "mini_claude_code.parity:main"
mcc-agent = "mini_claude_code.agent.cli:main"
mcc-eval = "mini_claude_code.eval.cli:main"
mcc-db-inspect = "mini_claude_code.db_inspect:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "psycopg[binary]>=3.0",
    "neo4j>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_claude_code"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast tests with no network or Docker",
    "integration: needs Docker, Ollama, and/or API keys (skip if unavailable)",
]
addopts = "-q"
